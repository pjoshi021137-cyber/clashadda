<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wallet - BGR</title><script src="https://cdn.tailwindcss.com"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script></head><body class="bg-black text-white p-4"><h1 class="font-black">Wallet - Real System</h1><p class="text-xs text-gray-400">Deposit -> piyush021137@fam QR -> Deposit Wallet (No Withdraw) | Win Wallet -> Any UPI Withdraw</p><div class="grid md:grid-cols-2 gap-3 mt-4"><div class="bg-white/5 p-4 rounded"><h2 class="font-bold">Deposit</h2><img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=upi://pay?pa=piyush021137@fam" class="mt-2 bg-white p-2 rounded"><input id="depAmt" type="number" placeholder="Amount" class="w-full bg-black p-2 rounded mt-2"><input id="depUtr" placeholder="UTR/Txn ID" class="w-full bg-black p-2 rounded mt-2"><button onclick="reqDep()" class="w-full bg-green-600 py-2 rounded mt-2">Request Deposit</button></div><div class="bg-white/5 p-4 rounded"><h2 class="font-bold">Withdraw Win Wallet Only</h2><p class="text-xs">Win: <span id="winW">₹0</span></p><input id="wdAmt" type="number" placeholder="Amount" class="w-full bg-black p-2 rounded mt-2"><input id="wdUpi" placeholder="Your Any UPI" class="w-full bg-black p-2 rounded mt-2"><button onclick="reqWd()" class="w-full bg-blue-600 py-2 rounded mt-2">Request Withdraw</button></div></div><div id="tx" class="mt-4 text-xs"></div><script src="firebase-config.js"></script><script>const db=firebase.firestore();let cur=null;firebase.auth().signInAnonymously().onAuthStateChanged(u=>{cur=u;load();});function load(){db.collection("users").doc(cur.uid).onSnapshot(d=>{winW.innerText='₹'+(d.data()?.winWallet||0);});db.collection("transactions").where("uid","==",cur.uid).orderBy("at","desc").onSnapshot(s=>{let h="";s.forEach(doc=>{let t=doc.data();h+=`<div class="bg-white/5 p-2 rounded mt-2 flex justify-between"><span>${t.type} ₹${t.amount} ${t.status}</span><span>${t.upi||''}</span></div>`});tx.innerHTML=h;});}async function reqDep(){let amt=Number(depAmt.value);await db.collection("transactions").add({uid:cur.uid,type:'deposit',amount:amt,utr:depUtr.value,upi:'piyush021137@fam',at:new Date(),status:'pending'});alert('Deposit request - Admin verify karega piyush021137@fam pe');}async function reqWd(){let amt=Number(wdAmt.value);let upi=wdUpi.value;let u=(await db.collection("users").doc(cur.uid).get()).data();if((u?.winWallet||0)<amt){alert('Win Wallet kam');return;}await db.collection("users").doc(cur.uid).update({winWallet:firebase.firestore.FieldValue.increment(-amt)});await db.collection("transactions").add({uid:cur.uid,type:'withdraw',amount:amt,upi,at:new Date(),status:'pending'});alert('Withdraw request');}</script></body></html>
