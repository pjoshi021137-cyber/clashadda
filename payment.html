<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>UPI Payment - BGR</title>
<style>body{margin:0;background:#08080f;color:#fff;font-family:Inter;padding:16px}.card{background:#13131f;border:1px solid #222;border-radius:16px;padding:16px;max-width:500px;margin:20px auto}.btn{border:0;padding:12px;border-radius:12px;font-weight:900;width:100%;cursor:pointer}.btn-y{background:linear-gradient(90deg,#ffcc00,#ff6a00);color:#000}input{width:100%;background:#0a0a14;border:1px solid #333;color:#fff;padding:10px;border-radius:10px;margin:6px 0}</style></head><body>
<div class="card"><h2 style="color:#ffcc00">💰 UPI Payment - BGR eSPORTS</h2><p>UPI ID: <b style="color:#00ff88">piyush021137@fam</b></p>
<img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=upi://pay?pa=piyush021137@fam&pn=BGR%20eSPORTS" style="display:block;margin:10px auto;background:#fff;padding:10px;border-radius:12px">
<input id="amt" placeholder="Amount ₹"><input id="txn" placeholder="UPI Transaction ID"><input id="proof" type="file" accept="image/*"><small>Fraud Detection: Duplicate Transaction Protection | Screenshot Proof Required | Auto Verify</small><br><br><button class="btn btn-y" onclick="submitPay()">Submit Payment Proof</button><br><br><button class="btn" style="background:#222;color:#fff" onclick="location.href='./index.html'">Back to Home</button></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";
const firebaseConfig = { apiKey: "AIzaSyDnYj8ht1gXigIWzj5K1W98mRLTOfmoXOU", authDomain: "clashadda-b3e57.firebaseapp.com", projectId: "clashadda-b3e57", storageBucket: "clashadda-b3e57.firebasestorage.app", messagingSenderId: "1046410116766", appId: "1:1046410116766:web:02fa3a28be10e39b28058f" };
const app = initializeApp(firebaseConfig); const db = getFirestore(app); const storage = getStorage(app);
window.submitPay=async function(){
 let url=''; const file=document.getElementById('proof').files[0];
 if(file){ const r=ref(storage,'paymentProofs/'+Date.now()+'_'+file.name); await uploadBytes(r,file); url=await getDownloadURL(r); }
 await addDoc(collection(db,"payments"), { amount:document.getElementById('amt').value, txnId:document.getElementById('txn').value, proofUrl:url, upi:'piyush021137@fam', status:'Pending Verify', createdAt:serverTimestamp() });
 alert('Payment Submitted! Admin will verify - piyush021137@fam'); location.href='./index.html';
}
