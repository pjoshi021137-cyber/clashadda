<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BGR eSports Ultra Pro Max</title>
<style>
body{margin:0;background:#090a0d;color:white;font-family:Arial}
header{padding:18px;background:#151515;color:#e8bd58;font-weight:bold}
main{padding:18px;max-width:1000px;margin:auto}
.panel{background:#171717;border:1px solid #57451f;border-radius:12px;padding:18px;margin:15px 0}
input,button,select{box-sizing:border-box;width:100%;padding:12px;margin:7px 0;border-radius:8px}
input,select{background:#080808;color:white;border:1px solid #444}
button{background:#e8bd58;color:#111;font-weight:bold;border:0}
.hidden{display:none}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
table{width:100%;border-collapse:collapse}
td,th{text-align:left;padding:10px;border-bottom:1px solid #444}
.gold{color:#e8bd58}
@media(max-width:600px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>BGR eSPORTS — ULTRA PRO MAX OWNER PANEL</header>

<main>
<section id="login" class="panel">
<h2 class="gold">OWNER LOGIN</h2>
<input id="email" type="email" placeholder="Owner Email">
<input id="password" type="password" placeholder="Password">
<button id="loginBtn">SECURE LOGIN</button>
</section>

<section id="dashboard" class="hidden">
<h2 class="gold">OWNER DASHBOARD</h2>
<button id="logoutBtn">Logout</button>
<div class="grid">
<div class="panel">Players <h2 id="players">0</h2></div>
<div class="panel">Tournaments <h2 id="tournamentsCount">0</h2></div>
<div class="panel">Registrations <h2 id="registrationsCount">0</h2></div>
</div>

<div class="panel">
<h3 class="gold">Create Tournament</h3>
<form id="tournamentForm">
<input id="title" placeholder="Tournament Name" required>
<input id="map" placeholder="Map Name" required>
<input id="date" type="date" required>
<input id="time" type="time" required>
<select id="mode">
<option>Solo</option><option>Duo</option><option>Squad</option>
</select>
<input id="slots" type="number" placeholder="Maximum Players" value="48">
<input id="fee" type="number" placeholder="Entry Fee" value="0">
<input id="prize" type="number" placeholder="Prize Pool" value="0">
<button type="submit">CREATE TOURNAMENT</button>
</form>
</div>

<div class="panel">
<h3 class="gold">Tournament List</h3>
<div id="tournamentList"></div>
</div>

<div class="panel">
<h3 class="gold">Player List</h3>
<div id="playerList"></div>
</div>
</section>
</main>
<script type="module">
import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  doc,
  getDocs,
  addDoc,
  deleteDoc,
  query,
  limit,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";

/* यहाँ index.html वाला Firebase config डालना है */
const firebaseConfig = {
  apiKey: "AIzaSyDnYj8ht1gXigIWzj5K1W98mRLTOfmoXOU",
  authDomain: "clashadda-b3e57.firebaseapp.com",
  databaseURL: "https://clashadda-b3e57-default-rtdb.firebaseio.com",
  projectId: "clashadda-b3e57",
  storageBucket: "clashadda-b3e57.firebasestorage.app",
  messagingSenderId: "1046410116766",
  appId: "1:1046410116766:web:02fa3a28be10e39b28058f",
  measurementId: "G-60KBXTZKE9"
};

/* Owner UID */
const OWNER_UID = "LMPbpNrgbpOSTd4xglwfAbZlGXE2";

const firebaseApp = initializeApp(firebaseConfig);
const auth = getAuth(firebaseApp);
const db = getFirestore(firebaseApp);

const $ = id => document.getElementById(id);

$("loginBtn").onclick = async () => {
  try {
    await signInWithEmailAndPassword(
      auth,
      $("email").value.trim(),
      $("password").value
    );
  } catch (error) {
    alert("Login Error: " + error.message);
  }
};

$("logoutBtn").onclick = () => signOut(auth);

onAuthStateChanged(auth, async user => {
  if (!user) {
    $("login").classList.remove("hidden");
    $("dashboard").classList.add("hidden");
    return;
  }

  if (user.uid !== OWNER_UID) {
    await signOut(auth);
    alert("Access Denied: Owner account only!");
    return;
  }

  $("login").classList.add("hidden");
  $("dashboard").classList.remove("hidden");

  await loadDashboard();
});

async function loadDashboard() {
  try {
    const [players, tournaments, registrations] =
      await Promise.all([
        getDocs(query(collection(db, "users"), limit(200))),
        getDocs(query(collection(db, "tournaments"), limit(200))),
        getDocs(query(collection(db, "registrations"), limit(200)))
      ]);

    $("players").textContent = players.size;
    $("tournamentsCount").textContent = tournaments.size;
    $("registrationsCount").textContent = registrations.size;

    $("tournamentList").innerHTML =
      tournaments.docs.map(item => {
        const t = item.data();
        return `
          <p>
            <b>${escapeHTML(t.title || "Tournament")}</b>
            — ${escapeHTML(t.date || "")}
            <button data-delete="${item.id}">Delete</button>
          </p>`;
      }).join("") || "No tournaments found";

    $("playerList").innerHTML =
      players.docs.map(item => {
        const p = item.data();
        return `<p>${escapeHTML(p.gameName || p.email || item.id)}</p>`;
      }).join("") || "No players found";

    document.querySelectorAll("[data-delete]").forEach(button => {
      button.onclick = async () => {
        if (!confirm("Delete this tournament?")) return;

        try {
          await deleteDoc(
            doc(db, "tournaments", button.dataset.delete)
          );
          alert("Tournament deleted");
          await loadDashboard();
        } catch (error) {
          alert("Delete failed: " + error.message);
        }
      };
    });

  } catch (error) {
    alert("Database Error: " + error.message);
  }
}

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

$("tournamentForm").onsubmit = async event => {
  event.preventDefault();

  try {
    await addDoc(collection(db, "tournaments"), {
      title: $("title").value.trim(),
      map: $("map").value.trim(),
      date: $("date").value,
      matchTime: $("time").value,
      mode: $("mode").value,
      maxPlayers: Number($("slots").value),
      fee: Number($("fee").value),
      prizePool: Number($("prize").value),
      joined: 0,
      status: "upcoming",
      createdAt: serverTimestamp()
    });

    alert("Tournament created successfully!");
    event.target.reset();
    $("slots").value = 48;
    $("fee").value = 0;
    $("prize").value = 0;
    await loadDashboard();

  } catch (error) {
    alert("Tournament Error: " + error.message);
  }
};
  </script>
  </body>
</html>
