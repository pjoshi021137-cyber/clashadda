<!DOCTYPE html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>BGR PRO DASHBOARD - BR BERMUDA</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script></head><body class="bg-[#0a0e14] text-white">
<header class="p-4 bg-white/5 flex justify-between items-center sticky top-0 backdrop-blur"><div><h1 class="font-black">BGR x CLASHADDA <span class="text-green-400">BR BERMUDA PRO</span></h1><p class="text-xs">All Ages | Auto Refund | Auto Wallet | UPI: piyush021137@fam</p></div><div class="flex gap-2"><button onclick="sendNotify()" class="bg-blue-600 px-3 py-2 rounded text-sm">Notify All</button><button onclick="openM()" class="bg-green-500 text-black px-4 py-2 rounded font-bold">+ ADD MATCH</button></div></header>
<div class="grid grid-cols-12 gap-4 p-4"><div class="col-span-12 lg:col-span-8"><div id="mList"></div></div><div class="col-span-12 lg:col-span-4 space-y-4"><div class="bg-white/5 p-4 rounded-xl"><h3 class="font-bold mb-2">STATS</h3><p>Active: <span id="ac">0</span> | Wallet Total: <span id="wt">₹0</span></p><div id="txn" class="mt-3 space-y-1 text-xs max-h-60 overflow-auto"></div></div><div class="bg-white/5 p-4 rounded-xl"><h3 class="font-bold">SOCIAL LINKS</h3><input id="yt" placeholder="YT Link" class="w-full bg-black p-2 mt-2 rounded text-sm"><input id="wa" placeholder="WhatsApp Channel" class="w-full bg-black p-2 mt-2 rounded text-sm"><button onclick="saveL()" class="w-full bg-green-600 mt-2 py-2 rounded">Save</button></div></div></div>

<div id="mModal" class="fixed inset-0 bg-black/80 hidden items-center justify-center p-4 z-50"><div class="bg-[#1a212e] p-6 rounded-xl w-full max-w-2xl"><h2 class="font-bold text-xl mb-4">Add Match - BR Bermuda Only</h2><div class="grid grid-cols-2 gap-2"><input id="t" placeholder="Title" class="col-span-2 bg-black p-3 rounded"><input id="time" type="datetime-local" class="bg-black p-3 rounded"><input value="Bermuda" disabled class="bg-green-900 p-3 rounded"><input id="pool" type="number" placeholder="Prize Pool ₹" class="bg-black p-3 rounded"><input id="pk" type="number" placeholder="Per Kill ₹" class="bg-black p-3 rounded"><input id="fee" type="number" placeholder="Entry Fee 0=Free" class="bg-black p-3 rounded"><input id="max" type="number" value="48" class="bg-black p-3 rounded"><input id="rid" placeholder="Room ID" class="bg-black p-3 rounded"><input id="rpass" placeholder="Room Pass" class="bg-black p-3 rounded"><select id="st" class="col-span-2 bg-black p-3 rounded"><option value="upcoming">Upcoming</option><option value="live">Live</option><option value="completed">Completed</option><option value="cancelled">Cancelled - Auto Refund</option></select></div><div class="flex gap-2 mt-4"><button onclick="closeM()" class="flex-1 bg-white/10 py-3 rounded">Cancel</button><button onclick="saveM()" class="flex-1 bg-green-600 py-3 rounded font-bold">Save + Notify</button></div></div></div>

<div id="pModal" class="fixed inset-0 bg-black/90 hidden z-[60] flex flex-col"><div class="p-4 flex justify-between border-b border-white/10"><h2 id="pmTitle" class="font-bold">Players</h2><button onclick="closeP()" class="bg-red-600 px-4 py-2 rounded">X</button></div><div class="flex-1 overflow-auto p-4"><table class="w-full text-sm"><thead><tr class="text-xs text-gray-400"><th class="p-2 text-left">Player</th><th>Kills</th><th>Wallet</th><th>Win ₹</th><th>PerKill</th><th>Total</th><th>Action</th></tr></thead><tbody id="pTable"></tbody></table></div><div class="p-4 border-t border-white/10 flex gap-2"><button onclick="cancelRefund()" class="bg-red-600 px-4 py-2 rounded text-sm">Cancel + Auto Refund</button><button onclick="finishM()" class="bg-blue-600 px-4 py-2 rounded text-sm">Finish Match</button></div></div>

<script>
const firebaseConfig={apiKey:"AIzaSyDnYj8ht1gXigIWzj5K1W98mRLTOfmoXOU",authDomain:"clashadda-b3e57.firebaseapp.com",projectId:"clashadda-b3e57",storageBucket:"clashadda-b3e57.firebasestorage.app",messagingSenderId:"1046410116766",appId:"1:1046410116766:web:02fa3a28be10e39b28058f"};
firebase.initializeApp(firebaseConfig);const db=firebase.firestore();firebase.auth().signInAnonymously();
let curId=null,curMatch=null,players=[];
function openM(){document.getElementById('mModal').classList.remove('hidden');document.getElementById('mModal').classList.add('flex')}function closeM(){document.getElementById('mModal').classList.add('hidden');curId=null}
db.collection("tournaments").orderBy("createdAt","desc").onSnapshot(s=>{let h="";s.forEach(d=>{let m=d.data();h+=`<div class="bg-white/5 p-4 rounded-xl mb-3 flex justify-between"><div><b>${m.name||m.title}</b> <span class="text-xs px-2 py-1 rounded ${m.status=='live'?'bg-red-600':'bg-green-600'}">${m.status||'upcoming'}</span><br><small>Pool:₹${m.prizePool||m.prize} | Kill:₹${m.perKill||0} | Fee:₹${m.fee||m.entryFee||0} | ${m.joined||0}/${m.maxPlayers||48} | Room:${m.roomId||'--'}</small></div><div class="flex gap-2"><button onclick="openP('${d.id}')" class="bg-yellow-500 text-black w-10 h-10 rounded">✏️</button><button onclick="editM('${d.id}')" class="bg-white/10 w-10 h-10 rounded">✎</button><button onclick="db.collection('tournaments').doc('${d.id}').delete()" class="bg-red-500/20 w-10 h-10 rounded">🗑</button></div></div>`});document.getElementById('mList').innerHTML=h;document.getElementById('ac').innerText=s.size});
async function saveM(){let d={name:document.getElementById('t').value,title:document.getElementById('t').value,time:document.getElementById('time').value,map:"Bermuda",mode:"BR",prizePool:Number(pool.value)||0,prize:Number(pool.value)||0,perKill:Number(pk.value)||0,entryFee:Number(fee.value)||0,fee:Number(fee.value)||0,maxPlayers:Number(max.value)||48,slots:Number(max.value)||48,roomId:rid.value,roomPass:rpass.value,status:st.value,createdAt:firebase.firestore.FieldValue.serverTimestamp(),joined:0,ageAllowed:"All"};if(curId)await db.collection("tournaments").doc(curId).update(d);else await db.collection("tournaments").add(d);if(d.status=='cancelled')alert('Cancelled - Ab Pencil me jaake Auto Refund dabao');closeM();db.collection("notifications").add({message:`New: ${d.title} Bermuda Pool ₹${d.prizePool}`,at:firebase.firestore.FieldValue.serverTimestamp()})}
let editData={};async function editM(id){let doc=await db.collection("tournaments").doc(id).get();let m=doc.data();curId=id;editData=m;document.getElementById('t').value=m.title||m.name;document.getElementById('pool').value=m.prizePool||m.prize;document.getElementById('pk').value=m.perKill||0;document.getElementById('fee').value=m.entryFee||m.fee||0;document.getElementById('max').value=m.maxPlayers||48;document.getElementById('rid').value=m.roomId||"";document.getElementById('rpass').value=m.roomPass||"";document.getElementById('st').value=m.status||"upcoming";openM();}
function openP(id){curId=id;db.collection("tournaments").doc(id).get().then(d=>curMatch=d.data());document.getElementById('pModal').classList.remove('hidden');db.collection("registrations").where("tournamentId","==",id).onSnapshot(s=>{players=[];let h="";s.forEach(doc=>{let p=doc.data();p.docId=doc.id;players.push(p);let tot=(p.kills||0)*(curMatch.perKill||0)+(p.winAmount||0);h+=`<tr class="border-b border-white/5"><td class="p-2"><b>${p.playerName||p.name}</b><br><small>${p.uid?.substring(0,6)}</small></td><td><input value="${p.kills||0}" onchange="updK('${doc.id}',this.value)" class="w-14 bg-black p-1 rounded text-center"></td><td>₹${p.wallet||0}</td><td><input value="${p.winAmount||0}" onchange="updW('${doc.id}',this.value)" class="w-16 bg-yellow-900/30 p-1 rounded text-center"></td><td>₹${curMatch.perKill||0}</td><td class="text-green-400 font-bold">₹${tot}</td><td><button onclick="pay('${doc.id}',${tot},'${p.uid}')" class="bg-green-600 px-2 py-1 rounded text-xs">PAY</button></td></tr>`});document.getElementById('pTable').innerHTML=h||'<tr><td colspan=7 class="text-center py-10">No Players</td></tr>'})}function closeP(){document.getElementById('pModal').classList.add('hidden')}
async function updK(id,v){await db.collection("registrations").doc(id).update({kills:Number(v)})}async function updW(id,v){await db.collection("registrations").doc(id).update({winAmount:Number(v)})}
async function pay(docId,amt,uid){if(!confirm(`Pay ₹${amt}?`))return;await db.collection("users").doc(uid).set({wallet:firebase.firestore.FieldValue.increment(amt)}, {merge:true});await db.collection("transactions").add({uid,type:"win",amount:amt,matchId:curId,at:firebase.firestore.FieldValue.serverTimestamp(),status:"paid"});await db.collection("registrations").doc(docId).update({paid:true});alert('Paid! Auto Wallet Transfer Done')}
async function cancelRefund(){if(!confirm('Auto Refund All Entry Fee?'))return;let batch=db.batch();players.forEach(p=>{let fee=curMatch.entryFee||curMatch.fee||0;if(fee>0)batch.update(db.collection("users").doc(p.uid),{wallet:firebase.firestore.FieldValue.increment(fee)});});await batch.commit();await db.collection("tournaments").doc(curId).update({status:'cancelled'});alert('Auto Refund Done!')}
function finishM(){db.collection("tournaments").doc(curId).update({status:'completed'});alert('Match Completed!')}
function saveL(){db.collection("siteSettings").doc("links").set({yt:yt.value,wa:wa.value,at:new Date()});alert('Saved!')}function sendNotify(){let m=prompt('Notify msg:');if(m)db.collection("notifications").add({message:m,at:firebase.firestore.FieldValue.serverTimestamp()})}
db.collection("transactions").orderBy("at","desc").limit(10).onSnapshot(s=>{let h="";s.forEach(d=>{let t=d.data();h+=`<div class="flex justify-between bg-black/30 p-1 rounded"><span>${t.type} ${t.uid?.substring(0,5)}</span><span>₹${t.amount}</span></div>`});document.getElementById('txn').innerHTML=h});
</script></body></html>
