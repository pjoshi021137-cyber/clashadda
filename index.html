<!DOCTYPE html>
<html lang="en">
<head>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#ffcc00">
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BGR eSPORTS - ULTRA PRO MAX 100%</title>
<link rel="icon" href="./logo.png">
<style>
:root{--bg:#07070a;--card:#12121a;--card2:#1c1c27;--yellow:#ffcc00;--orange:#ff6a00;--text:#fff;--muted:#777;--green:#00ff88}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,sans-serif}
.header{position:fixed;top:0;left:0;right:0;background:#0c0c12;border-bottom:1px solid #222;padding:12px 16px;z-index:10;display:flex;justify-content:space-between;align-items:center}
.main{margin-top:60px;padding:14px;max-width:600px;margin-left:auto;margin-right:auto}
.card{background:var(--card);border:1px solid #222;border-radius:16px;padding:16px;margin:10px 0}
.badge{padding:4px 10px;border-radius:20px;font-size:10px;font-weight:900}
.BR{background:#00e5ff;color:#000}.CS{background:#ff9800;color:#000}.LW{background:#ff006a;color:#fff}.HS{background:#00ff88;color:#000}
.tabs{display:flex;gap:6px;overflow-x:auto}.tab{padding:8px 12px;border-radius:20px;background:#1e1e2a;color:var(--muted);font-size:11px;font-weight:800;cursor:pointer}.tab.active{background:var(--yellow);color:#000}
input,select,textarea{background:#09090f;border:1px solid #2a2a3a;color:#fff;padding:11px;border-radius:10px;width:100%;margin:5px 0;box-sizing:border-box}
label{font-size:9px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;font-weight:800;margin-top:6px;display:block}
button{border:0;padding:12px;border-radius:12px;font-weight:900;cursor:pointer}.btn-yellow{background:linear-gradient(90deg,var(--yellow),var(--orange));color:#000;width:100%}.btn-dark{background:var(--card2);color:#fff;border:1px solid #333;width:100%;margin-top:6px}
.hidden{display:none}
</style>
</head>
<body>
<div class="header"><div><b style="color:var(--yellow)">BGR eSPORTS</b> <small>ULTRA PRO MAX</small></div><div style="font-size:9px;color:var(--yellow)">piyush021137@fam</div></div>
<div class="main">
<div class="tabs"><div class="tab active" onclick="filterMode('ALL',this)">ALL</div><div class="tab" onclick="filterMode('BR',this)">BR</div><div class="tab" onclick="filterMode('CS',this)">CS 1v1/2v2/4v4</div><div class="tab" onclick="filterMode('LW',this)">LW</div><div class="tab" onclick="filterMode('HS',this)">HS</div></div>

<div class="card" style="border-color:var(--yellow)">
<h3 style="margin:0">🔥 CREATE TOURNAMENT - PRO MAX</h3>
<label>GAME MODE</label><select id="cMode" onchange="onMode()"><option value="BR">BR - Battle Royale</option><option value="CS">CS - Clash Squad</option><option value="LW">LW - Lone Wolf</option><option value="HS">HS - Headshot</option></select>
<label>MATCH TYPE - CS me 1v1/2v2/4v4</label><select id="cType" onchange="onType()"></select>
<div style="display:flex;gap:8px"><div style="flex:1"><label>Team</label><select id="cTeam"></select></div><div style="flex:1"><label>Slots</label><input id="cSlots" type="number"></div></div>
<input id="cName" placeholder="BGR CS 1v1 ULTRA #1">
<div style="display:flex;gap:8px"><div style="flex:1"><label>Entry ₹</label><input id="cFee" type="number" value="20"></div><div style="flex:1"><label>Prize ₹</label><input id="cPrize" type="number" value="500"></div><div style="flex:1"><label>Kill ₹</label><input id="cKill" type="number" value="10"></div></div>
<div style="display:flex;gap:8px"><div style="flex:1"><label>Room ID</label><input id="cRoomId"></div><div style="flex:1"><label>Room Pass</label><input id="cRoomPass"></div></div>
<input id="cTime" type="datetime-local">
<button class="btn-yellow" onclick="createFinal()">🚀 CREATE - FIREBASE ONLINE</button>
<small style="color:var(--muted)">UPI: piyush021137@fam | Room 10 min pehle share hoga</small>
</div>

<div id="tList"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyDnYj8ht1gXigIWzj5K1W98mRLTOfmoXOU",
  authDomain: "clashadda-b3e57.firebaseapp.com",
  databaseURL: "https://clashadda-b3e57-default-rtdb.firebaseio.com",
  projectId: "clashadda-b3e57",
  storageBucket: "clashadda-b3e57.firebasestorage.app",
  messagingSenderId: "1046410116766",
  appId: "1:1046410116766:web:02fa3a28be10e39b28058f",
  measurementId: "G-60KBXTZKE9"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const typeMap = {
 BR: [{v:'Solo',slots:48,team:['Solo']},{v:'Duo',slots:24,team:['Duo']},{v:'Squad',slots:12,team:['Squad']}],
 CS: [{v:'1vs1',slots:16,team:['Solo']},{v:'2vs2',slots:8,team:['Duo']},{v:'4vs4',slots:4,team:['Squad']}],
 LW: [{v:'1vs1',slots:16,team:['Solo']},{v:'2vs2',slots:8,team:['Duo']}],
 HS: [{v:'1vs1',slots:12,team:['Solo']},{v:'2vs2',slots:6,team:['Duo']},{v:'4vs4',slots:3,team:['Squad']}]
};
window.onMode = function(){
 const mode=document.getElementById('cMode').value; const tSel=document.getElementById('cType'); tSel.innerHTML='';
 typeMap[mode].forEach(o=>{let op=document.createElement('option');op.value=o.v;op.text=`${mode} ${o.v}`;op.dataset.slots=o.slots; tSel.appendChild(op);});
 onType();
}
window.onType = function(){
 const mode=document.getElementById('cMode').value; const type=document.getElementById('cType').value;
 const d=typeMap[mode].find(x=>x.v===type); if(d){document.getElementById('cSlots').value=d.slots; document.getElementById('cTeam').innerHTML=d.team.map(t=>`<option>${t}</option>`).join('');}
}
window.createFinal = async function(){
 const data={
  mode:document.getElementById('cMode').value, type:document.getElementById('cType').value,
  name:document.getElementById('cName').value||'BGR CUP', fee:+document.getElementById('cFee').value,
  prize:+document.getElementById('cPrize').value, kill:+document.getElementById('cKill').value,
  slots:+document.getElementById('cSlots').value, team:document.getElementById('cTeam').value,
  roomId:document.getElementById('cRoomId').value, roomPass:document.getElementById('cRoomPass').value,
  time:document.getElementById('cTime').value, joined:0, createdAt: serverTimestamp()
 };
 await addDoc(collection(db,"tournaments"), data);
 alert("✅ Firebase me Save Ho Gaya! 100% Online! CS 1v1/2v2/4v4 Ready!");
}
let allData=[];
const q = query(collection(db,"tournaments"), orderBy("createdAt","desc"));
onSnapshot(q, (snap)=>{
 allData = snap.docs.map(d=>({id:d.id,...d.data()}));
 render(allData);
});
window.render = function(list){
 const div=document.getElementById('tList'); div.innerHTML='';
 if(list.length===0){div.innerHTML='<div class="card" style="text-align:center;color:var(--muted)">No Tournament - Create Kar</div>';return;}
 list.forEach(t=>{
  let el=document.createElement('div'); el.className='card'; el.style.borderLeft='4px solid #ffcc00';
  el.innerHTML=`<div style="display:flex;justify-content:space-between"><span class="badge ${t.mode}">${t.mode} ${t.type} | ${t.team}</span><small>${t.joined||0}/${t.slots} Joined</small></div><h3 style="margin:6px 0">${t.name}</h3><div style="font-size:11px;color:var(--muted)">💰 Prize ₹${t.prize} | 🎯 Kill ₹${t.kill} | 🎫 Entry ₹${t.fee}</div><div style="font-size:11px">⏰ ${t.time||'TBA'} | 🔐 Room: ${t.roomId?'Ready ✅':'TBA'}</div><button class="btn-yellow" onclick="alert('JOIN - UPI piyush021137@fam pe ₹${t.fee} Pay karo! Room ID match se 10 min pehle milega!')">JOIN NOW - ₹${t.fee}</button>`;
  div.appendChild(el);
 });
}
window.filterMode = function(m,el){
 document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active')); el.classList.add('active');
 if(m==='ALL') render(allData); else render(allData.filter(x=>x.mode===m));
}
onMode();
</script>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js')}</script>
</body>
</html>
