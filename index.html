
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b1020">
<title>ClashAdda | Player</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  background:#080d19;color:white;
  font-family:Arial,sans-serif;padding:18px
}
.container{
  width:100%;max-width:390px;
  background:#151e30;border:1px solid #293750;
  border-radius:18px;padding:28px;
  box-shadow:0 15px 45px #0008
}
.logo{text-align:center;font-size:30px;font-weight:900;color:#ffb52e}
.subtitle{text-align:center;color:#aab7ca;margin:10px 0 25px}
h2{text-align:center;font-size:20px}
input{
  width:100%;padding:14px;margin:8px 0;
  border-radius:9px;border:1px solid #40516c;
  background:#0b1425;color:white;font-size:15px
}
button{
  width:100%;padding:14px;margin-top:12px;
  border:0;border-radius:9px;background:#ffb52e;
  color:#111;font-weight:bold;font-size:15px
}
button.secondary{background:#293750;color:white}
button:disabled{opacity:.5}
#message{text-align:center;font-size:13px;color:#ffcf75;line-height:1.5}
#dashboard{display:none;text-align:center}
.small{color:#aab7ca;font-size:13px}
</style>
</head>

<body>
<div class="container">

  <div class="logo">CLASHADDA</div>
  <p class="subtitle">Free Fire Tournament Platform</p>

  <section id="authSection">
    <h2 id="heading">Player Login</h2>

    <input id="name" type="text"
      placeholder="Player Name (for registration)"
      autocomplete="name">

    <input id="email" type="email"
      placeholder="Email Address"
      autocomplete="email">

    <input id="password" type="password"
      placeholder="Password"
      autocomplete="current-password">

    <button id="loginBtn">PLAYER LOGIN</button>
    <button id="registerBtn" class="secondary">
      CREATE PLAYER ACCOUNT
    </button>

    <p id="message">Welcome to ClashAdda!</p>
    <p class="small">
      Use your own account. Keep your password private.
    </p>
  </section>

  <section id="dashboard">
    <h2>Welcome to ClashAdda!</h2>
    <p id="playerEmail"></p>
    <p class="small">Your account is signed in.</p>
    <button id="logoutBtn">LOGOUT</button>
  </section>

</div>

<script type="module">

import { initializeApp } from
"https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  createUserWithEmailAndPassword,
  updateProfile,
  onAuthStateChanged,
  signOut
} from
"https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";

// CLASHADDA FIREBASE CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyDnYj8ht1gXigIWzj5K1W98mRLTOfmoXOU",
  authDomain: "clashadda-b3e57.firebaseapp.com",
  databaseURL: "https://clashadda-b3e57-default-rtdb.firebaseio.com",
  projectId: "clashadda-b3e57",
  storageBucket: "clashadda-b3e57.firebasestorage.app",
  messagingSenderId: "1046410116766",
  appId: "1:1046410116766:web:02fa3a28be10e39b28058f",
  measurementId: "G-60KBXTZKE9"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const $ = id => document.getElementById(id);

function showMessage(message){
  $("message").textContent = message;
}

$("loginBtn").addEventListener("click", async () => {
  const email = $("email").value.trim();
  const password = $("password").value;

  if(!email || !password){
    showMessage("Enter your email and password.");
    return;
  }

  $("loginBtn").disabled = true;
  showMessage("Logging in...");

  try{
    await signInWithEmailAndPassword(auth,email,password);
    showMessage("Login successful!");
  }catch(error){
    showMessage("Login failed: " + error.message);
  }finally{
    $("loginBtn").disabled = false;
  }
});

$("registerBtn").addEventListener("click", async () => {
  const name = $("name").value.trim();
  const email = $("email").value.trim();
  const password = $("password").value;

  if(!name || !email || !password){
    showMessage("Enter your name, email and password.");
    return;
  }

  if(password.length < 6){
    showMessage("Password must be at least 6 characters.");
    return;
  }

  $("registerBtn").disabled = true;
  showMessage("Creating your account...");

  try{
    const result = await createUserWithEmailAndPassword(
      auth,email,password
    );

    await updateProfile(result.user,{
      displayName:name
    });

    showMessage("Account created successfully!");
  }catch(error){
    showMessage("Registration failed: " + error.message);
  }finally{
    $("registerBtn").disabled = false;
  }
});

$("logoutBtn").addEventListener("click", async () => {
  await signOut(auth);
});

onAuthStateChanged(auth,user => {
  if(user){
    $("authSection").style.display = "none";
    $("dashboard").style.display = "block";
    $("playerEmail").textContent =
      user.displayName || user.email;
  }else{
    $("authSection").style.display = "block";
    $("dashboard").style.display = "none";
  }
});

</script>
</body>
</html>
