
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BGR eSports - Owner Login</title>
  <link rel="stylesheet" href="owner-login.css">
</head>
<body>
  <div class="login-container">
    <div class="logo">BGR <span>eSports</span></div>
    <h2>OWNER LOGIN</h2>
    <p class="subtitle">Secure Admin Access</p>

    <form id="loginForm">
      <label for="email">Owner Email</label>
      <input
        type="email"
        id="email"
        placeholder="Enter owner email"
        required
      >

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        placeholder="Enter password"
        required
      >

      <button type="submit">SECURE LOGIN</button>
      <p id="message"></p>
    </form>
  </div>

  <script src="owner-login.js"></script>
</body>
</html>
